    <script>
        window.earthquakeLiftData = {};

        document.addEventListener('DOMContentLoaded', function() {
            fetch('202611061348_earthquake_lift_data.json')
                .then(response => response.json())
                .then(data => {
                    window.earthquakeLiftData = data;
                    console.log("連動マップ用JSONの読み込みが完了しました。");
                })
                .catch(error => console.error("JSONの読み込みに失敗しました:", error));

            var mapObj = null;
            for (var key in window) {
                if (key.startsWith('map_') && window[key] instanceof L.Map) {
                    mapObj = window[key];
                    break;
                }
            }

            if (mapObj) {
                mapObj.on('popupopen', function(e) {
                    var popup = e.popup;
                    var popupDiv = popup.getElement().querySelector('[data-coord]');
                    if (popupDiv) {
                        var coordKey = popupDiv.getAttribute('data-coord');
                        var htmlContent = window.earthquakeLiftData[coordKey];
                        if (htmlContent) {
                            popupDiv.innerHTML = htmlContent;
                        } else {
                            popupDiv.innerHTML = "データが見つかりません。";
                        }

                        // 初回オープン時のはみ出しを防ぐため、ポップアップサイズを強制再計算
                        setTimeout(function() {
                            popup.update();
                        }, 50);
                    }
                });
            }
        });
    </script>
