    <script>
        window.earthquakeLiftData = {};

        document.addEventListener('DOMContentLoaded', function() {
            fetch('202610281650_earthquake_lift_data.json')
                .then(response => response.json())
                .then(data => {
                    window.earthquakeLiftData = data;
                    console.log("連動マップ用JSONの読み込みが完了しました。");
                })
                .catch(error => console.error("JSONの読み込みに失敗しました:", error));
        });

        // Leafletのポップアップが開いたときのイベント
        document.addEventListener('click', function(e) {
            // ユーザーが矩形（Rectangle）をクリックした少し後に走るようにする
            setTimeout(function() {
                var popupContents = document.querySelectorAll('.leaflet-popup-content [data-coord]');
                popupContents.forEach(function(popupDiv) {
                    var coordKey = popupDiv.getAttribute('data-coord');
                    var htmlContent = window.earthquakeLiftData[coordKey];
                    // まだ「読み込み中」のままで、データが存在する場合に差し替え
                    if (htmlContent && popupDiv.innerHTML.includes("データを読み込み中")) {
                        popupDiv.innerHTML = htmlContent;
                    }
                });
            }, 100);
        });
    </script>
